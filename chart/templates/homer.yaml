{{- if .Values.homer.enabled }}
{{- $fullname := include "sipmediagw.fullname" . -}}
{{- $homer := .Values.homer -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: homer-db
spec:
  type: ClusterIP
  selector:
    {{- include "sipmediagw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: homer-db
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: homer-db
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "sipmediagw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: homer-db
  template:
    metadata:
      labels:
        {{- include "sipmediagw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: homer-db
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ $homer.postgres.image.repository }}:{{ $homer.postgres.image.tag }}"
          imagePullPolicy: {{ $homer.postgres.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $homer.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $homer.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "root"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "root"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $homer.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $homer.postgres.storage.storageClass }}
        storageClassName: {{ $homer.postgres.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $homer.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-heplify
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: heplify
spec:
  type: ClusterIP
  selector:
    {{- include "sipmediagw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: heplify
  ports:
    - name: hep-tcp
      port: 9060
      targetPort: 9060
    - name: hep-udp
      protocol: UDP
      port: 9060
      targetPort: 9060
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-heplify
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: heplify
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sipmediagw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: heplify
  template:
    metadata:
      labels:
        {{- include "sipmediagw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: heplify
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: heplify-server
          image: "{{ $homer.heplifyServer.image.repository }}:{{ $homer.heplifyServer.image.tag }}"
          imagePullPolicy: {{ $homer.heplifyServer.image.pullPolicy }}
          env:
            - name: HEPLIFYSERVER_DBDRIVER
              value: postgres
            - name: HEPLIFYSERVER_DBADDR
              value: "{{ $fullname }}-postgres:5432"
            - name: HEPLIFYSERVER_DBUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $homer.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: HEPLIFYSERVER_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ $homer.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: HEPLIFYSERVER_DBSHEMA
              value: homer7
            - name: HEPLIFYSERVER_DBDROPDAYS
              value: "15"
            - name: HEPLIFYSERVER_DBROTATE
              value: "true"
            - name: HEPLIFYSERVER_LOGSTD
              value: "true"
            - name: HEPLIFYSERVER_HEPTCPADDR
              value: 0.0.0.0:9060
          ports:
            - name: hep-tcp
              containerPort: 9060
            - name: hep-udp
              containerPort: 9060
              protocol: UDP
          livenessProbe:
            tcpSocket:
              port: hep-tcp
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml $homer.heplifyServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-homer-webapp
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: homer-webapp
spec:
  type: ClusterIP
  selector:
    {{- include "sipmediagw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: homer-webapp
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-homer-webapp
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: homer-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sipmediagw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: homer-webapp
  template:
    metadata:
      labels:
        {{- include "sipmediagw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: homer-webapp
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webapp
          image: "{{ $homer.webapp.image.repository }}:{{ $homer.webapp.image.tag }}"
          imagePullPolicy: {{ $homer.webapp.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: "{{ $fullname }}-postgres"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $homer.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $homer.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml $homer.webapp.resources | nindent 12 }}
{{- end }}
