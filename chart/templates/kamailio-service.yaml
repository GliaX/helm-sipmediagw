{{- if .Values.kamailio.enabled }}
{{- $fullname := include "sipmediagw.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kamailio
  labels:
    {{- include "sipmediagw.labels" . | nindent 4 }}
    app.kubernetes.io/component: kamailio
  annotations:
    {{- toYaml .Values.kamailio.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.kamailio.service.type }}
  {{- if and (eq .Values.kamailio.service.type "NodePort") .Values.kamailio.service.nodePort }}
  # Cluster, not Local: the forwarding rule may target any cluster node, and
  # kube-proxy relays to the kamailio pod wherever it lives.
  externalTrafficPolicy: Cluster
  {{- else }}
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    {{- include "sipmediagw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kamailio
  ports:
    - name: sip-tcp
      protocol: TCP
      port: {{ .Values.kamailio.service.port }}
      targetPort: 5060
      {{- if and (eq .Values.kamailio.service.type "NodePort") .Values.kamailio.service.nodePort }}
      nodePort: {{ .Values.kamailio.service.nodePort }}
      {{- end }}
{{- end }}
